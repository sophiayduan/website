<body>
    <section style="display:flex;justify-content:center;align-items:center;flex-direction:column;gap:10px;padding-top:2rem;">

        <h1 style="margin:0;">404</h1>
        <div style="text-align:center;">
            <p>Oops! This page doesn't exist. Want to head back <a class="inspo" href="index.html" target="_self">home</a>?</p>
            <p>Enjoy this picture of a random cute dog.</p>
        </div>
        <img id="randomDog" src="" alt="cute dog" style="width:80%; max-width:500px;border-radius:1rem;border:4px dashed var(--clr-projBorders);background-color:var(--clr-projects)">
        <script>
            function cuteDog(){
                const dawg = document.getElementById("randomDog");
                fetch("https://dog.ceo/api/breeds/image/random")
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "success") {
                            dawg.src = data.message;
                            dawg.style.display = "block";
                            loading.style.display = "none";
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }
            cuteDog();

        </script>
